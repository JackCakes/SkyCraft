; SkyCraft: Skyrim with Minecraft physics, inventory and blocks.
; Goes in Data\SKSE\Plugins\ next to SkyCraft.dll.

[Minecraft]
; Start Minecraft when Skyrim starts. It stays hidden (no window, no music), opens its SkyCraft world
; by itself once you're in game, and quits when Skyrim closes. 0 = start Minecraft yourself.
bStartWithSkyrim = 1

; Empty: the Minecraft that comes with SkyCraft (a portable Prism Launcher, unpacked to
; %LOCALAPPDATA%\SkyCraft; the first time it asks you to sign in with your Microsoft account).
; Or the full path of your own launcher (Prism, MultiMC, or a .bat file) to use that instead.
sLauncher =

; What to pass to your own launcher. For Prism: --launch and the SkyCraft instance's folder name.
sArguments = --launch SkyCraft

[Controls]
; The key that switches between Minecraft's controls and Skyrim's own. In Skyrim's mode you move,
; look, fight and use Skyrim's inventory, magic, shouts and perks as in plain Skyrim, with no
; Minecraft HUD and no placed blocks drawn, and Minecraft's player just follows yours. Press the
; key again to go back to Minecraft. SkyCraft keeps this key to itself in both modes, so pick one
; Minecraft doesn't need.
; A key name (F1-F12, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock) or a
; DirectInput scan code (66 or 0x42). Esc, ~, G, H, J, M, O and F9 are already used.
sToggleKey = F8

; 1 (the default): start every session, and every save you load, with Skyrim's controls (switch to
; Minecraft's with the key above). Handy for playing through Skyrim's scripted opening, then switching
; over. 0: start with Minecraft's controls.
bStartInSkyrimMode = 1

; The key that resets the Minecraft world: every block you built or dug is removed, so nothing is left
; floating where Skyrim has moved on (through a door, fast travel). Press it twice within 6 seconds to
; confirm. Skyrim's controls take over for the few seconds it takes, then you're back where you were.
; Your inventory and health stay. Same key names as sToggleKey, and it can't be the same key as that.
; None switches it off.
sResetKey = F7

[Mobs]
; Minecraft's mobs each have an invisible Skyrim actor (a stand-in) where they stand: it is what Skyrim's
; spells hit (lock-on uses True Directional Movement's virtual targets, never the stand-in), and what Skyrim's NPCs fight. How it is kept out of sight:
;   geometry  its body isn't drawn, but the actor is left showing, so lock-on mods still see it (default). A new stand-in is
;             held at no alpha until its body has been found and hidden, so its spawn (the fade-in) is never seen
;   root      the whole actor is culled (nothing else can see it either; lock-on may skip it)
;   alpha     faded out
;   none      shown (a skeever, scaled to the mob), to check where the stand-ins stand
sStandInHide = geometry

; The creature a stand-in is made from. Its sounds are the stand-in's sounds (the footsteps, growls and hurt cries are the creature's own), so
; the default is a rabbit, which has no growls to make. A name of any creature in your game, or "Plugin.esp:0xFORMID" (the FormID without its
; load-order byte) for an actor from a mod, e.g. a silent one you made. Stand-ins are never made from a skeever by default, nor from a creature that has spells or abilities of its own (the Wabbajack's rabbit does, which shows as a red mist).
sStandInBase =

; Minecraft's mobs each have a body in Skyrim's world: an invisible collision box the size of the mob's own bounding box, which the player, NPCs,
; arrows and spells meet like a wall, and which follows the mob. This replaces the invisible creature (the stand-in actor) each mob used to have.
; Minecraft writes skycraft/mob_catalog.json (every distinct mob size, modded mobs included) the first time its world starts, and at plugin load a
; box model is made for each size into Data/Meshes/SkyCraft/MobLibrary. A size not in it is made while the game runs from spare models. 0 = the
; stand-in actors again (sStandInHide and sStandInBase above then apply).
bBoxBodies = 1

; Where mob_catalog.json is. Empty: where the Minecraft that comes with SkyCraft writes it.
sMobCatalog =

; Most mob bodies at once.
iMaxBodies = 64

; Skyrim's NPCs can only fight an actor, so each mob near them also keeps an invisible stand-in actor (as before) next to its body: it is what
; they draw on, close in on and strike. 0 = bodies only: NPCs then only play Minecraft-side fights (a weapon drawn, hits landing) and never really enter combat.
bStandInActors = 1

; Custom skeleton generation is disabled because the experimental NPC/race clone probe crashed on runtime 1.7.104.
; Vanilla stand-in actors remain ON for native Skyrim NPC combat against Minecraft mobs.
; Each stand-in actor gets a skeleton of SkyCraft's own (Data/Meshes/SkyCraft/MobActors): the mob's box, with the NPC's bounds set to it, instead of a
; rabbit's. The first one is a trial: if Skyrim doesn't give it a 3D, or crashes, custom skeletons turn themselves off (delete
; Data/SKSE/Plugins/SkyCraft/custom_skeleton.marker to try again). 0 = the stock creature's skeleton.
bCustomSkeleton = 0

[Debug]
; Detailed timing, camera, combat and lighting logs in SkyCraft.log (several lines a second), for
; reporting problems. 0 = off.
bDiagnostics = 0

[Collision]
; Skyrim's mode: Minecraft's blocks get real collision for everything in Skyrim (you, NPCs, arrows, spells), over the whole area Minecraft
; has sent. Each section of blocks is written as a small collision-only model (Data/Meshes/SkyCraft/BlockCollision, cleared at every start) of
; merged boxes and put in the world as an invisible static, so Skyrim's own loader makes the collision. If the models can't be made or load
; without collision on your install, SkyCraft.log says so and the block crates below hold you up instead. 0 = crates only.
bBlockMesh = 1

; On by default: the section collision models are loaded, with the layout that matches Skyrim's own statics (patch revisions 30-32). The block
; crates below stay under you until a model has been seen working in Skyrim's Havok world (SkyCraft.log says "works"), so there is always something
; to stand on. If Skyrim ever crashes while loading them, the last "Block collision test: LOADING" line in SkyCraft.log names the file; set this to 0
; to go back to crates only (a copy of some vanilla models is then made in Data/Meshes/SkyCraft/vanilla_dump to learn their layout).
bBlockMeshExperimental = 1

; The shape library: slabs, stairs, fences, doors and the other blocks that aren't whole cubes. Minecraft writes a catalogue of every distinct
; collision shape (skycraft/shape_catalog.json in its folder) the first time its world starts, and at plugin load SkyCraft makes a model for
; each into Data/Meshes/SkyCraft/BlockLibrary, which Skyrim has from its start. A block of such a shape is then a reference to its model
; instead of boxes in the section's model, so changing one doesn't rewrite the section. Used once a section model has been seen working;
; anything not in the library stays in the section models. The first session after installing has no catalogue yet, so it starts at the second.
; 0 = odd shapes always in the section models.
bShapeLibrary = 1

; Where the catalogue is. Empty: where the Minecraft that comes with SkyCraft writes it (%LOCALAPPDATA%\SkyCraft\Prism\instances\SkyCraft\.minecraft\skycraft),
; or Data\SKSE\Plugins\SkyCraft\shape_catalog.json. Set the full path of the file if you use your own launcher.
sShapeCatalog =

; The most library references at once (0 switches the library off).
iMaxShapeRefs = 600

; How many sections (16 blocks each) round you, sideways, get a model (1-8), and the most models at once.
iRadius = 4
iMaxMeshes = 220

; How much wider than a block the boxes are (a fraction), so boxes that meet leave no seam to catch a foot on.
fOverlap = 0.02

; Havok material of the blocks (their footsteps and impact sounds): 3741512247 is stone.
sMaterial = 3741512247

; Walking up steps like Minecraft: in Skyrim's mode, walking into a block (a stair, a slab, a carpet) no higher than fStepHeight (blocks; Minecraft's
; own is 0.6) lifts you onto it without a jump. fStepRadius is how wide your body is from its middle, and fStepReach how far from it a step is looked for;
; if you still stop at a stair, raise fStepReach a little (0.2); if you are lifted before you touch it, lower it. SkyCraft.log says "Step up: ..." each time
; (the first twelve).
bStepUp = 1
fStepHeight = 0.6
fStepRadius = 0.3
fStepReach = 0.14

; The block crates round you (see [Crates]) are kept until a section model has been seen working on your install (its collision in Skyrim's
; Havok world; SkyCraft.log says "works"), so there is always something to stand on. 1 = keep them even then.
bCratesWithMesh = 0

[Crates]
; Skyrim's mode: Minecraft's blocks are real, invisible crates put on the solid blocks around you, so Skyrim's own character controller
; stands, walks, steps, jumps and bumps on them like on any crate in the game. There is no other block collision for your character: with
; this off you fall through every block you place.
bBlockCrates = 1

; The base form of the crate: hex, as the console shows it (click a crate, read its base ID). Each is scaled to one block
; (its narrower side, plus fOverlap), its top set on the block's top. SkyCraft.log says what size it measured.
sBaseForm = 0x0007A617

; How many blocks around you (1-8) get crates.
iRange = 5

; How much wider than a block each crate is (0.05 = 5%), so neighbours overlap and there is no seam to catch your feet on.
fOverlap = 0.05

; Blocks to set the crates' tops below the top of their block (negative: above), to tune how the ground feels.
fSink = 0.0

[LockOn]
; Skyrim's mode: Minecraft's mobs (passive ones too) are handed to True Directional Movement as lock-on targets (they have no Skyrim actor to lock
; on to). Needs the TrueDirectionalMovement.dll built with TrueDirectionalMovement-VirtualTargets.patch; with any other TDM this does
; nothing and the log says so. 0 = off.
bLockOnMobs = 1

; How high up a mob's body the camera and your character face when locked on, as a fraction of its height.
fAimHeight = 0.6

; How far, in blocks, a mob can be and still be offered for lock-on (TDM's own lock-on distance applies as well).
fRange = 40

[ProgressionBridge]
; Convert Skyrim loot into Minecraft inventory items with acknowledgement.
; Mapping file: Data\\SKSE\\Plugins\\SkyCraftMappings.json
bEnabled = 1
